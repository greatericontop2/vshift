[project]
name = "vshift"
version = "0.1.0"
description = "Virtual shifting with custom gear ratios and a power display for smart trainers (Linux)"
requires-python = ">=3.10"
dependencies = ["bleak>=0.22", "PyYAML>=6"]

[project.scripts]
vshift = "vshift.app:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["vshift"]
