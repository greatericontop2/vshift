# vshift config. Anything you leave out falls back to the defaults in vshift/config.py.

trainer:
  name: "D500"          # substring of the trainer's Bluetooth name (or set address: "AA:BB:...")
  mode: auto            # auto | native | ftms_erg
  native_ratio_scale: 1.0

controllers:
  enabled: true
  # The Click v2 left pod only sends presses while a Zwift-server-signed unlock is valid.
  #   right_only     - use right-pod buttons only (no unlock ever); the left pod still
  #                    has to be on, since it carries the pair's Bluetooth link
  #   restart_left   - reboot the left pod every restart_left_s seconds so it gets a fresh
  #                    ~1 min window; left presses during the 1-2 s reboot are lost
  #   zwift_unlocked - you unlocked it in the Zwift app in the last ~24 h; use both pods
  click_v2_mode: right_only
  restart_left_s: 50

  # Button names
  #   Click v2 right pod: shift_up_right (+), a, b, y, z
  #   Click v2 left pod:  shift_up_left (-), up, down, left, right
  #   Click v1:           click_plus, click_minus
  # In right_only mode, mapping a left-pod button prints a warning at startup.
  shift_up: [click_plus, shift_up_right]
  shift_down: [click_minus, b]
  toggle_erg: [a]
  # With restart_left or zwift_unlocked you might prefer:
  # shift_up: [click_plus, shift_up_right]
  # shift_down: [click_minus, shift_up_left]
  # toggle_erg: [a]

cadence_sensor:
  enabled: false        # true if you add a Bluetooth CSC cadence sensor
  name: ""

gears:
  # A constant 3.5% step gives about +/-1.6 rpm worst case at 90 rpm.
  generate: {start: 1.2, end: 4.8, step_pct: 3.5}
  # Or write the gears out yourself (easiest first), for example tighter in the middle:
  # ratios: [1.0, 1.2, 1.4, 1.6, 1.8, 2.0, 2.1, 2.2, 2.3, 2.4, 2.5, 2.6, 2.7, 2.8, 2.9, 3.0,
  #          3.1, 3.2, 3.35, 3.5, 3.7, 3.9, 4.2, 4.5, 5.0]
  start_ratio: 2.4

rider: {rider_kg: 75, bike_kg: 9}

physics:
  # Used when this app does the physics (trainer.mode: ftms_erg, the --simulate rider,
  # and the speed shown in ftms_erg mode). Drag force = 0.5 * rho * cda * v^2.
  cda: 0.32            # m^2; ~0.40 upright on the hoods, ~0.32 drops, ~0.25 aero bars
  crr: 0.004           # also sent to the trainer
  rho: 1.2             # air density, kg/m^3
  drivetrain_eff: 0.97
  wheel_circ_m: 2.105  # 700x28c
  # Sent to the trainer, which does its own physics in native mode. Zwift uses 0.51;
  # treat it as relative to that (e.g. 0.41 for ~20% less air resistance).
  trainer_cwa: 0.51

cadence:
  target: 90
  source: trainer       # trainer | sensor | derived
  physical_chainring: 50  # only for 'derived': ring the chain sits on, on the Cog
  physical_cog: 14

erg: {start_watts: 200, step_watts: 5}
grade: {start_pct: 0.0, step_pct: 0.5}
display:
  power_avg_s: 3
  font_size: 72          # watts; the gear/cadence/speed row is half this
  speed_units: kmh       # kmh | mph
  front_ring_teeth: 50   # show the gear as 50/<cog>, e.g. "gear 20/42 (2.20) (50/22.7)"; 0 = off
  fullscreen: false      # F11 toggles at runtime
